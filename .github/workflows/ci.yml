name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Gives internal/metadata's own test suite (not a thinner Postgres-only
    # smoke test - the exact same jobs/snapshots/events behavioral tests
    # that run against SQLite by default) something real to run against, via
    # BOP_TEST_POSTGRES_DSN below - see internal/metadata/metadata_test.go's
    # openTestStore. A service container, not testcontainers-go, to avoid a
    # new dependency for a single service this simple.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bopuser
          POSTGRES_PASSWORD: bopci
          POSTGRES_DB: bop_metadata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bopuser -d bop_metadata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Test web UI
        run: npm --prefix web run test

      # internal/webui/dist is committed (see internal/webui/webui.go) so
      # `go build`/`go install` work with no Node.js runtime required -
      # this catches someone forgetting to run `make build-web` and commit
      # the result after changing web/.
      - name: Check committed UI build is up to date
        run: |
          if ! git diff --quiet -- internal/webui/dist; then
            echo "internal/webui/dist is out of date with web/ - run 'make build-web' and commit the result."
            git diff --stat -- internal/webui/dist
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # Runs on a real Linux runner with a C toolchain, catching data races
      # this project's Windows dev machine can't check locally (no cgo
      # compiler there, so -race won't even build). No BOP_TEST_POSTGRES_DSN
      # here deliberately - internal/metadata/metadata_test.go's
      # openTestStore picks a backend by that env var's presence, so this
      # step is what keeps SQLite (the default every current user actually
      # runs, and TestPruneEventsSubSecondBoundary/WholeSecondVsFractional's
      # permanent modernc/sqlite regression guards) covered on every push.
      - name: Test (race detector)
        run: go test -race ./...

      # A second pass of just internal/metadata against the postgres
      # service above - proves the metadata.driver: postgres path
      # (docs/06-high-availability.md's HA prerequisite) with the exact
      # same behavioral suite the step above already ran against SQLite,
      # not a thinner Postgres-only smoke test. Deliberately additive to
      # the step above, not a replacement for it - see that step's comment.
      - name: Test metadata against Postgres
        env:
          BOP_TEST_POSTGRES_DSN: postgres://bopuser:bopci@localhost:5432/bop_metadata_test?sslmode=disable
        run: go test -race ./internal/metadata/...
