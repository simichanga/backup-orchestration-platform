name: Release

# Fires only on a version tag (e.g. v1.2.3) - not every push to main, so
# tagging a commit is the deliberate "this is a real release" signal.
# Hand-rolled rather than GoReleaser: two pure-Go cross-compile targets
# don't need a dependency to orchestrate, matching this project's existing
# preference for the smallest tool that solves the actual problem (static
# bearer tokens over OIDC, minisign over cosign in docs/07 - same reasoning).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Rebuilt here rather than trusting the committed internal/webui/dist -
      # a release binary should never ship a frontend that's out of sync
      # with what CI actually validated for this commit.
      - name: Build web UI
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X bop/internal/cli.Version=${VERSION}"

          mkdir -p dist build/windows-amd64 build/linux-amd64

          # CGO_ENABLED=0 cross-compiles cleanly from one Linux runner for
          # both targets - only possible because metadata already uses the
          # pure-Go modernc.org/sqlite driver, not a cgo one.
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o build/windows-amd64/bop.exe ./cmd/bop
          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o build/linux-amd64/bop     ./cmd/bop

          # README/TESTING travel inside each archive, not as separate
          # release assets - useful to whoever only downloaded the zip/tar.
          cp README.md TESTING.md build/windows-amd64/
          cp README.md TESTING.md build/linux-amd64/

          (cd build/windows-amd64 && zip -q "../../dist/bop-${VERSION}-windows-amd64.zip" bop.exe README.md TESTING.md)
          (cd build/linux-amd64   && tar czf "../../dist/bop-${VERSION}-linux-amd64.tar.gz" bop README.md TESTING.md)

          (cd dist && sha256sum -- *.zip *.tar.gz > checksums.txt)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip dist/*.tar.gz dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
